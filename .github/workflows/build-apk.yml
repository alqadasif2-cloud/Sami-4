name: Build Sami App (Web & Android APK)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Distribution to Android Assets
        run: |
          mkdir -p app/src/main/assets/assets
          cp -r dist/* app/src/main/assets/ || true
          cp -r public/* app/src/main/assets/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          echo "=== 1. Building Debug APK ==="
          ./gradlew :app:assembleDebug --stacktrace
          echo "=== 2. Building Release APK ==="
          ./gradlew :app:assembleRelease --stacktrace || echo "Release build encountered an issue, Debug APK will be packaged"
          echo "=== 3. Listing Generated APK Files ==="
          find app/build/outputs/apk/ -type f -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Trading-Tracker-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### 🚀 تقرير بناء تطبيق Sami" >> $GITHUB_STEP_SUMMARY
          echo "- **ملفات APK**: تم تجميعها ورفعها بنجاح في قسم Artifacts بأعلى صفحة البناء لتنزيلها مباشرة." >> $GITHUB_STEP_SUMMARY
          echo "- **تحديث الويب**: تم دمج آخر كود HTML/JS/CSS المحدث داخل حزمة الـ APK." >> $GITHUB_STEP_SUMMARY
